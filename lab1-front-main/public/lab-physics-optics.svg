<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="opticsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b18" />
      <stop offset="50%" stop-color="#0c122b" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="prismRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="20%" stop-color="#f97316" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Optics Table Lab Room -->
  <rect width="1200" height="700" fill="url(#opticsBg)" />

  <!-- Optical Breadboard Hole Grid -->
  <g fill="#1e293b" fill-opacity="0.4">
    <pattern id="breadboardGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.5" fill="#334155" />
      <circle cx="20" cy="20" r="1.2" fill="#0f172a" />
    </pattern>
    <rect x="60" y="460" width="1080" height="210" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="60" y="460" width="1080" height="210" fill="url(#breadboardGrid)" />
  </g>

  <!-- Quantum / Physics formulas & coordinate frames on wall -->
  <g stroke="#38bdf8" stroke-opacity="0.2" fill="none">
    <circle cx="300" cy="220" r="90" stroke-dasharray="4 4" />
    <ellipse cx="300" cy="220" rx="90" ry="35" transform="rotate(30 300 220)" />
    <ellipse cx="300" cy="220" rx="90" ry="35" transform="rotate(-30 300 220)" />
    <circle cx="300" cy="220" r="12" fill="#38bdf8" fill-opacity="0.5" />
    <text x="300" y="340" font-family="monospace" font-size="12" fill="#38bdf8" fill-opacity="0.5" text-anchor="middle">E = ħω | λ = h/p</text>
  </g>

  <!-- Solid-State Laser Emitter (Left) -->
  <rect x="120" y="410" width="150" height="55" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="270" y="425" width="25" height="25" rx="2" fill="#334155" />
  <circle cx="295" cy="437.5" r="5" fill="#38bdf8" filter="url(#laserGlow)" />
  <rect x="140" y="425" width="60" height="25" rx="2" fill="#0284c7" />
  <text x="170" y="442" font-family="monospace" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">532 nm</text>

  <!-- High-Power Green/Cyan Laser Beam -->
  <line x1="295" y1="437.5" x2="520" y2="437.5" stroke="#38bdf8" stroke-width="4" filter="url(#laserGlow)" />
  <line x1="295" y1="437.5" x2="520" y2="437.5" stroke="#ffffff" stroke-width="1.5" />

  <!-- Optical Beam Splitter / Prism Mount (Center) -->
  <rect x="500" y="470" width="40" height="20" fill="#475569" rx="2" />
  <rect x="517" y="440" width="6" height="30" fill="#64748b" />
  <polygon points="520,380 480,450 560,450" fill="rgba(255, 255, 255, 0.15)" stroke="#38bdf8" stroke-width="2" />

  <!-- Split Reflected Beam (Vertical to Mirror) -->
  <line x1="520" y1="437.5" x2="520" y2="180" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7" filter="url(#laserGlow)" />
  <!-- Top Mirror -->
  <rect x="495" y="170" width="50" height="12" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="495" y1="182" x2="545" y2="182" stroke="#e2e8f0" stroke-width="2" />

  <!-- Refracted Dispersed Spectrum Beams from Prism -->
  <polygon points="545,435 850,330 850,490 545,445" fill="url(#prismRainbow)" fill-opacity="0.45" filter="url(#laserGlow)" />
  <line x1="545" y1="435" x2="850" y2="330" stroke="#ef4444" stroke-width="2.5" />
  <line x1="545" y1="438" x2="850" y2="370" stroke="#eab308" stroke-width="2.5" />
  <line x1="545" y1="440" x2="850" y2="410" stroke="#22c55e" stroke-width="2.5" />
  <line x1="545" y1="442" x2="850" y2="450" stroke="#06b6d4" stroke-width="2.5" />
  <line x1="545" y1="445" x2="850" y2="490" stroke="#8b5cf6" stroke-width="2.5" />

  <!-- Detector Screen Array (Right) -->
  <rect x="850" y="310" width="18" height="200" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="2" />

  <!-- Digital Oscilloscope / Spectrograph Unit (Right) -->
  <rect x="890" y="360" width="220" height="160" rx="6" fill="#0b1329" stroke="#38bdf8" stroke-width="2" />
  <rect x="905" y="375" width="190" height="95" rx="3" fill="#040918" />
  <!-- Grid on screen -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="905" y1="422" x2="1095" y2="422" />
    <line x1="1000" y1="375" x2="1000" y2="470" />
  </g>
  <!-- Oscilloscope Sine Wave Waveform -->
  <path d="M 905 422 Q 925 390 945 422 T 985 422 T 1025 422 T 1065 422 T 1095 422" 
        fill="none" stroke="#6ECE9D" stroke-width="2.5" filter="url(#laserGlow)" />
  <text x="915" y="490" font-family="monospace" font-size="11" fill="#38bdf8">f: 440.0 THz</text>
  <text x="1010" y="490" font-family="monospace" font-size="11" fill="#6ECE9D">Δφ: 0.04 rad</text>

  <!-- Top Title Badge in Lab Room -->
  <g transform="translate(420, 45)">
    <rect width="360" height="40" rx="20" fill="#091026" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="24" cy="20" r="6" fill="#38bdf8" />
    <text x="44" y="25" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600" letter-spacing="1">
      QUANTUM OPTICS &amp; PHYSICS LAB
    </text>
  </g>
</svg>

