<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017" />
      <stop offset="50%" stop-color="#101a24" />
      <stop offset="100%" stop-color="#060c13" />
    </linearGradient>
    <linearGradient id="cuvetteLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.85" />
    </linearGradient>
    <filter id="bioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Laboratory Room Background -->
  <rect width="1200" height="700" fill="url(#bioBg)" />

  <!-- Chemical Analytics Counter -->
  <rect x="60" y="490" width="1080" height="180" rx="8" fill="#131e2b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />
  <line x1="60" y1="505" x2="1140" y2="505" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- DNA Double Helix Background Hologram -->
  <g stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 160 120 Q 200 180 160 240 T 160 360 T 160 480" />
    <path d="M 220 120 Q 180 180 220 240 T 220 360 T 220 480" />
    <line x1="165" y1="150" x2="215" y2="150" stroke="#38bdf8" stroke-opacity="0.4" />
    <line x1="180" y1="180" x2="200" y2="180" stroke="#6ECE9D" stroke-opacity="0.4" />
    <line x1="165" y1="210" x2="215" y2="210" stroke="#ec4899" stroke-opacity="0.4" />
    <line x1="160" y1="240" x2="220" y2="240" stroke="#38bdf8" stroke-opacity="0.4" />
    <line x1="165" y1="270" x2="215" y2="270" stroke="#6ECE9D" stroke-opacity="0.4" />
  </g>

  <!-- UV-Vis Spectrophotometer Main Chassis (Center) -->
  <rect x="340" y="320" width="460" height="190" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Sample Compartment Lid & Cuvette -->
  <rect x="370" y="345" width="130" height="140" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <rect x="420" y="370" width="30" height="90" rx="2" fill="url(#cuvetteLiquid)" stroke="#ffffff" stroke-width="1.5" filter="url(#bioGlow)" />
  <line x1="350" y1="415" x2="420" y2="415" stroke="#ec4899" stroke-width="3" filter="url(#bioGlow)" />
  <line x1="450" y1="415" x2="520" y2="415" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Spectrophotometer Touch Screen Display -->
  <rect x="525" y="345" width="250" height="140" rx="6" fill="#030712" stroke="#6ECE9D" stroke-width="1.5" />
  <!-- Absorption Spectrum Graph on Screen -->
  <path d="M 545 460 Q 580 460 600 440 T 635 380 T 670 450 L 755 455" fill="none" stroke="#6ECE9D" stroke-width="2.5" filter="url(#bioGlow)" />
  <text x="635" y="370" font-family="monospace" font-size="9" fill="#ec4899" text-anchor="middle">λmax = 525 nm</text>
  <text x="545" y="365" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="bold">Abs: 0.842 AU</text>
  <text x="690" y="365" font-family="monospace" font-size="10" fill="#94a3b8">C: 1.25 mM</text>

  <!-- Auto-Titration Burette Stand (Right) -->
  <rect x="870" y="160" width="10" height="340" fill="#64748b" />
  <rect x="840" y="495" width="70" height="10" rx="2" fill="#475569" />
  <!-- Precision Glass Burette Tube -->
  <rect x="910" y="180" width="16" height="230" rx="3" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="912" y="240" width="12" height="170" rx="1" fill="#38bdf8" fill-opacity="0.75" />
  <!-- Burette Valve & Droplet -->
  <polygon points="910,410 926,410 918,430" fill="#94a3b8" />
  <circle cx="918" cy="442" r="3.5" fill="#38bdf8" filter="url(#bioGlow)" />

  <!-- Magnetic Stirrer & Erlenmeyer Flask Below Burette -->
  <rect x="880" y="475" width="80" height="25" rx="3" fill="#1e293b" stroke="#6ECE9D" stroke-width="1" />
  <path d="M912 438 L924 438 L935 470 L900 470 Z" fill="#ec4899" fill-opacity="0.5" stroke="#ffffff" stroke-width="1" />

  <!-- Top Title Badge in Lab Room -->
  <g transform="translate(420, 45)">
    <rect width="360" height="40" rx="20" fill="#091522" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="24" cy="20" r="6" fill="#ec4899" />
    <text x="44" y="25" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600" letter-spacing="1">
      BIOCHEMISTRY &amp; ANALYTICAL LAB
    </text>
  </g>
</svg>
