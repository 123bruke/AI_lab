<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210" />
      <stop offset="50%" stop-color="#0f1f1a" />
      <stop offset="100%" stop-color="#07100d" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#6ECE9D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ECE9D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6ECE9D" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Laboratory Room Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Grid Blueprint lines on wall -->
  <g stroke="#6ECE9D" stroke-width="0.5" stroke-opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="700" />
    <line x1="200" y1="0" x2="200" y2="700" />
    <line x1="300" y1="0" x2="300" y2="700" />
    <line x1="400" y1="0" x2="400" y2="700" />
    <line x1="500" y1="0" x2="500" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="700" y1="0" x2="700" y2="700" />
    <line x1="800" y1="0" x2="800" y2="700" />
    <line x1="900" y1="0" x2="900" y2="700" />
    <line x1="1000" y1="0" x2="1000" y2="700" />
    <line x1="1100" y1="0" x2="1100" y2="700" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Molecular Structure in background -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" fill="none">
    <polygon points="220,120 270,90 320,120 320,170 270,200 220,170" />
    <polygon points="320,120 370,90 420,120 420,170 370,200 320,170" />
    <polygon points="270,200 320,230 320,280 270,310 220,280 220,230" />
    <circle cx="220" cy="120" r="4" fill="#38bdf8" fill-opacity="0.6" />
    <circle cx="270" cy="90" r="4" fill="#6ECE9D" fill-opacity="0.6" />
    <circle cx="320" cy="120" r="4" fill="#a78bfa" fill-opacity="0.6" />
    <circle cx="420" cy="120" r="4" fill="#38bdf8" fill-opacity="0.6" />
  </g>

  <!-- Lab Workstation Counter Surface -->
  <rect x="50" y="520" width="1100" height="150" rx="8" fill="#13231e" stroke="#6ECE9D" stroke-width="1.5" stroke-opacity="0.3" />
  <line x1="50" y1="535" x2="1150" y2="535" stroke="#6ECE9D" stroke-width="2" stroke-opacity="0.5" />

  <!-- Glow under reaction apparatus -->
  <circle cx="600" cy="450" r="160" fill="url(#glowGlow)" filter="url(#neonBlur)" />

  <!-- Retort Stand (Left-Center) -->
  <rect x="560" y="220" width="8" height="300" fill="#64748b" />
  <rect x="520" y="515" width="90" height="10" rx="2" fill="#475569" />
  <rect x="560" y="270" width="70" height="6" fill="#94a3b8" />
  <circle cx="630" cy="273" r="12" fill="none" stroke="#94a3b8" stroke-width="3" />

  <!-- Bunsen Burner -->
  <rect x="585" y="470" width="30" height="50" fill="#334155" rx="2" />
  <rect x="575" y="515" width="50" height="8" fill="#1e293b" rx="2" />
  <!-- Flame -->
  <path d="M600 470 C590 440, 595 410, 600 395 C605 410, 610 440, 600 470 Z" fill="url(#flameGrad)" filter="url(#neonBlur)" />
  <path d="M600 470 C595 450, 597 430, 600 415 C603 430, 605 450, 600 470 Z" fill="#ffffff" />

  <!-- Erlenmeyer Flask sitting on clamp -->
  <path d="M620 260 L640 260 L640 290 L675 380 Q685 400 665 400 L595 400 Q575 400 585 380 L620 290 Z" 
        fill="url(#flaskGrad)" stroke="#38bdf8" stroke-width="2" />
  <!-- Liquid Meniscus & Bubbles -->
  <path d="M592 370 Q630 365 668 370 L665 400 L595 400 Z" fill="#6ECE9D" fill-opacity="0.8" />
  <circle cx="620" cy="380" r="3" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="640" cy="375" r="2" fill="#ffffff" fill-opacity="0.7" />
  <circle cx="632" cy="360" r="2.5" fill="#a7f3d0" fill-opacity="0.9" />
  <circle cx="625" cy="340" r="2" fill="#a7f3d0" fill-opacity="0.6" />

  <!-- Glassware Condenser Tube -->
  <path d="M630 260 C630 220, 710 220, 750 250 L850 340 L850 420" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.5" />
  <path d="M630 260 C630 220, 710 220, 750 250 L850 340 L850 420" fill="none" stroke="#6ECE9D" stroke-width="2" stroke-opacity="0.8" />

  <!-- Receiver Beaker (Right) -->
  <rect x="825" y="420" width="50" height="95" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" />
  <rect x="826" y="465" width="48" height="48" rx="2" fill="#38bdf8" fill-opacity="0.65" />
  <!-- Beaker graduation lines -->
  <line x1="827" y1="440" x2="840" y2="440" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="827" y1="455" x2="845" y2="455" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="827" y1="470" x2="840" y2="470" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="827" y1="485" x2="845" y2="485" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Chemical Reagent Bottles on Shelves (Left) -->
  <rect x="140" y="440" width="40" height="75" rx="4" fill="#a855f7" fill-opacity="0.4" stroke="#c084fc" stroke-width="1.5" />
  <rect x="150" y="428" width="20" height="12" fill="#64748b" rx="2" />
  <rect x="145" y="465" width="30" height="20" fill="#ffffff" fill-opacity="0.9" rx="1" />
  <text x="160" y="478" font-family="monospace" font-size="8" fill="#1e293b" font-weight="bold" text-anchor="middle">HCl</text>

  <rect x="200" y="450" width="36" height="65" rx="4" fill="#f59e0b" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1.5" />
  <rect x="208" y="440" width="20" height="10" fill="#64748b" rx="2" />
  <rect x="204" y="470" width="28" height="18" fill="#ffffff" fill-opacity="0.9" rx="1" />
  <text x="218" y="482" font-family="monospace" font-size="8" fill="#1e293b" font-weight="bold" text-anchor="middle">NaOH</text>

  <rect x="255" y="435" width="42" height="80" rx="4" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="266" y="423" width="20" height="12" fill="#64748b" rx="2" />
  <rect x="260" y="460" width="32" height="22" fill="#ffffff" fill-opacity="0.9" rx="1" />
  <text x="276" y="474" font-family="monospace" font-size="7" fill="#1e293b" font-weight="bold" text-anchor="middle">CuSO4</text>

  <!-- Digital Analytical Balance Display (Center Right) -->
  <rect x="940" y="480" width="130" height="42" rx="4" fill="#091410" stroke="#6ECE9D" stroke-width="1.5" />
  <rect x="950" y="487" width="110" height="28" rx="2" fill="#042017" />
  <text x="1005" y="506" font-family="monospace" font-size="14" fill="#6ECE9D" font-weight="bold" text-anchor="middle">142.850 g</text>

  <!-- Top Title Badge in Lab Room -->
  <g transform="translate(420, 45)">
    <rect width="360" height="40" rx="20" fill="#0c1a15" stroke="#6ECE9D" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="24" cy="20" r="6" fill="#6ECE9D" />
    <text x="44" y="25" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600" letter-spacing="1">
      CHEMISTRY RESEARCH LABORATORY
    </text>
  </g>
</svg>
