version: '3.8'

services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - ./moseb_lab.db:/app/moseb_lab.db
      - ./error_logs.db:/app/error_logs.db
      - ./logs:/app/logs
    restart: unless-stopped
