services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: moseb-lab-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 8000

  # 2. 3D Virtual Chemistry Laboratory Frontend
  - type: static
    name: moseb-lab-frontend
    buildCommand: "node scripts/install.cjs && node scripts/build.cjs"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
